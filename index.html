<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ANC Life Planning</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;

      font-family:
        Arial,
        "Noto Sans Thai",
        sans-serif;

      background: #f5f7fa;
      color: #222;
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
    }

    .card {
      background: #fff;

      border-radius: 24px;

      padding: 28px 22px;

      box-shadow:
        0 8px 30px
        rgba(0,0,0,0.08);
    }

    .logo {
      text-align: center;

      font-size: 50px;

      margin-bottom: 8px;
    }

    h1 {
      text-align: center;

      margin: 0;

      font-size: 24px;
    }

    .subtitle {
      text-align: center;

      color: #777;

      margin-top: 8px;

      margin-bottom: 25px;
    }

    .welcome {
      background: #f5f7fa;

      border-radius: 16px;

      padding: 18px;

      margin-bottom: 20px;
    }

    .welcome-title {
      font-size: 14px;

      color: #777;

      margin-bottom: 5px;
    }

    .welcome-name {
      font-size: 20px;

      font-weight: bold;
    }

    .section {
      margin-top: 20px;
    }

    .section-title {
      font-size: 18px;

      font-weight: bold;

      margin-bottom: 12px;
    }

    label {
      display: block;

      margin-top: 14px;

      margin-bottom: 6px;

      font-size: 14px;

      color: #555;
    }

    input,
    textarea {

      width: 100%;

      padding: 13px 14px;

      border: 1px solid #ddd;

      border-radius: 12px;

      font-size: 16px;

      outline: none;

      font-family: inherit;

      background: #fff;

    }

    input:focus,
    textarea:focus {

      border-color: #999;

    }

    textarea {

      min-height: 90px;

      resize: vertical;

    }

    .user-id {

      margin-top: 20px;

      padding: 12px;

      background: #f8f8f8;

      border-radius: 10px;

      font-size: 11px;

      color: #777;

      word-break: break-all;

    }

    .button {

      width: 100%;

      border: none;

      border-radius: 14px;

      padding: 15px;

      margin-top: 25px;

      font-size: 17px;

      font-weight: bold;

      cursor: pointer;

      background: #111;

      color: white;

    }

    .button:active {

      transform: scale(0.98);

    }

    .status {

      text-align: center;

      color: #777;

      margin-bottom: 20px;

    }

    .error {

      padding: 15px;

      background: #fef2f2;

      color: #991b1b;

      border-radius: 12px;

      margin-top: 15px;

    }

    .payment-option {

    display: flex;
  
    align-items: center;
  
    gap: 15px;
  
    padding: 16px;
  
    margin-bottom: 12px;
  
    border: 2px solid #eee;
  
    border-radius: 16px;
  
    cursor: pointer;
  
    transition: 0.2s;
  
    }
    
    .payment-option.selected {
    
      border-color: #111;
    
      background: #f5f5f5;
    
    }
    
    
    .frequency-grid {
    
      display: grid;
    
      grid-template-columns: 1fr;
    
      gap: 10px;
    
    }
    
    
    .frequency-button {
    
      padding: 14px;
    
      border: 2px solid #eee;
    
      border-radius: 14px;
    
      background: white;
    
      font-size: 16px;
    
      cursor: pointer;
    
    }
    
    
    .frequency-button.selected {
    
      border-color: #111;
    
      background: #f5f5f5;
    
    }
  
    .summary-card {
  
    margin-bottom:16px;
  
    padding:16px;
  
    border:1px solid #eee;
  
    border-radius:16px;
  
    background:#fff;
  
    line-height:1.8;
  
  }
  
  .summary-title {
  
    font-size:17px;
  
    font-weight:bold;
  
    margin-bottom:10px;
  
    padding-bottom:8px;
  
    border-bottom:1px solid #eee;
  
  }
  
  .required {
    color: #e53935;
    font-weight: bold;
    margin-left: 3px;
  }
  </style>

</head>


<body>

<div class="container">

  <div class="card">

    <div class="logo">
      🎉
    </div>

    <h1>
      ANC Life Planning
    </h1>

    <div class="subtitle">
      ระบบสมัครประกันออนไลน์
    </div>


    <div
      id="status"
      class="status"
    >
      🔄 กำลังเชื่อมต่อ LINE...
    </div>


    <div id="app"></div>

  </div>

</div>


<script>


// ============================================
// LIFF CONFIG
// ============================================

const LIFF_ID =
  "2011077014-4bdad1VJ";


// ============================================
// GLOBAL USER
// ============================================

let lineUser = null;

let applicationData = {

  USER_ID: "",
  DisplayName: "",

  // =========================
  // ข้อมูลผู้สมัคร
  // =========================

  FullName: "",
  IDCard: "",
  LaserID: "",
  BirthDate: "",
  IDExpireDate: "",
  Nationality: "",
  Phone: "",
  Email: "",

  Weight: "",
  Height: "",
  Disease: "",
  HospitalHistory: "",

  // =========================
  // การชำระเงิน
  // =========================

  PaymentMethod: "",
  PaymentFrequency: "",

  // =========================
  // การทำงาน
  // =========================

  Occupation: "",
  Company: "",
  Position: "",
  JobDescription: "",
  AnnualIncome: "",

  // =========================
  // ที่อยู่
  // =========================

  CurrentAddress: null,
  HouseAddress: null,
  SameAddress: false,

  // =========================
  // ผู้รับผลประโยชน์
  // =========================

  Beneficiaries: []

};

let beneficiaries = [];

// ============================================
// START LIFF
// ============================================

async function main() {

  try {

    setStatus(
      "🔄 กำลังเริ่มต้น LIFF..."
    );


    // ------------------------------------------
    // Initialize
    // ------------------------------------------

    await liff.init({

      liffId: LIFF_ID

    });


    // ------------------------------------------
    // Login
    // ------------------------------------------

    if (!liff.isLoggedIn()) {

      setStatus(
        "🔐 กำลังเข้าสู่ระบบ LINE..."
      );

      liff.login();

      return;

    }


    // ------------------------------------------
    // Get Profile
    // ------------------------------------------

    setStatus(
      "🔄 กำลังอ่านข้อมูล LINE..."
    );


    const profile =
      await liff.getProfile();


    lineUser = {

      userId:
        profile.userId,

      displayName:
        profile.displayName,

      pictureUrl:
        profile.pictureUrl || ""

    };


    console.log(
      "LINE USER:",
      lineUser
    );


    // ------------------------------------------
    // Show Application Form
    // ------------------------------------------

    setStatus(
      "✅ เชื่อมต่อ LINE สำเร็จ"
    );


    showApplicationForm();


  } catch (error) {

    console.error(error);


    setStatus(
      "❌ เกิดข้อผิดพลาด"
    );


    document.getElementById(
      "app"
    ).innerHTML = `

      <div class="error">

        ไม่สามารถเชื่อมต่อ LINE ได้

        <br><br>

        ${escapeHtml(
          error.message ||
          error.toString()
        )}

      </div>

    `;

  }

}

// ============================================
// APPLICATION FORM
// ============================================

function showApplicationForm() {

  const app =
    document.getElementById("app");


  // ==========================================
  // ค่าที่เคยกรอกไว้
  // ==========================================

  const data = applicationData || {};


  app.innerHTML = `

    <div class="welcome">

      <div class="welcome-title">
        ยินดีต้อนรับครับ
      </div>

      <div class="welcome-name">
        ${escapeHtml(
          lineUser.displayName
        )}
      </div>

    </div>


    <div class="section">

      <div class="section-title">
        📝 ข้อมูลผู้สมัคร
      </div>


      <!-- ================================= -->
      <!-- ชื่อ -->
      <!-- ================================= -->

      <label>
        ชื่อ - นามสกุล
        <span class="required">*</span>
      </label>

      <input
        id="fullName"
        type="text"
        placeholder="กรุณากรอกชื่อ - นามสกุล"
        value="${escapeHtml(
          data.FullName || ""
        )}"
      >


      <!-- ================================= -->
      <!-- เลขบัตรประชาชน -->
      <!-- ================================= -->

      <label>
        เลขบัตรประชาชน
        <span class="required">*</span>
      </label>

      <input
        id="idCard"
        type="text"
        inputmode="numeric"
        maxlength="13"
        placeholder="เลขบัตรประชาชน 13 หลัก"
        value="${escapeHtml(
          data.IDCard || ""
        )}"
      >


      <!-- ================================= -->
      <!-- เลขหลังบัตร -->
      <!-- ================================= -->

      <label>
        เลขหลังบัตรประชาชน
        <span class="required">*</span>
      </label>

      <input
        id="laserID"
        type="text"
        placeholder="เช่น ME1-1234567-89"
        value="${escapeHtml(
          data.LaserID || ""
        )}"
      >


      <!-- ================================= -->
      <!-- วันเกิด -->
      <!-- ================================= -->

      <label>
        วันเดือนปีเกิด
        <span class="required">*</span>
      </label>

      <input
        id="birthDate"
        type="date"
        value="${escapeHtml(
          data.BirthDate || ""
        )}"
      >


      <!-- ================================= -->
      <!-- วันหมดอายุ -->
      <!-- ================================= -->

      <label>
        วันหมดอายุบัตรประชาชน
        <span class="required">*</span>
      </label>

      <input
        id="idExpireDate"
        type="date"
        value="${escapeHtml(
          data.IDExpireDate || ""
        )}"
      >


      <!-- ================================= -->
      <!-- สัญชาติ -->
      <!-- ================================= -->

      <label>
        สัญชาติ
        <span class="required">*</span>
      </label>

      <input
        id="nationality"
        type="text"
        placeholder="เช่น ไทย"
        value="${escapeHtml(
          data.Nationality || "ไทย"
        )}"
      >


      <!-- ================================= -->
      <!-- เบอร์โทร -->
      <!-- ================================= -->

      <label>
        เบอร์โทรศัพท์
        <span class="required">*</span>
      </label>

      <input
        id="phone"
        type="tel"
        inputmode="numeric"
        maxlength="10"
        placeholder="08xxxxxxxx"
        value="${escapeHtml(
          data.Phone || ""
        )}"
      >


      <!-- ================================= -->
      <!-- Email -->
      <!-- ================================= -->

      <label>
        อีเมล
		<span class="required">*</span>
      </label>

      <input
        id="email"
        type="email"
        placeholder="example@email.com"
        value="${escapeHtml(
          data.Email || ""
        )}"
      >


      <!-- ================================= -->
      <!-- น้ำหนัก -->
      <!-- ================================= -->

      <label>
        น้ำหนัก (กก.)
        <span class="required">*</span>
      </label>

      <input
        id="weight"
        type="number"
        inputmode="decimal"
        placeholder="เช่น 70"
        value="${escapeHtml(
          data.Weight || ""
        )}"
      >


      <!-- ================================= -->
      <!-- ส่วนสูง -->
      <!-- ================================= -->

      <label>
        ส่วนสูง (ซม.)
        <span class="required">*</span>
      </label>

      <input
        id="height"
        type="number"
        inputmode="numeric"
        placeholder="เช่น 170"
        value="${escapeHtml(
          data.Height || ""
        )}"
      >


      <!-- ================================= -->
      <!-- โรคประจำตัว -->
      <!-- ================================= -->

      <label>
        โรคประจำตัว
        <span class="required">*</span>
      </label>

      <textarea
        id="disease"
        placeholder="หากไม่มี กรุณาพิมพ์ว่า ไม่มี"
      >${escapeHtml(
        data.Disease || ""
      )}</textarea>


      <!-- ================================= -->
      <!-- ประวัติรักษา -->
      <!-- ================================= -->

      <label>
        ประวัติการรักษาในโรงพยาบาล
      </label>

      <textarea
        id="hospitalHistory"
        placeholder="หากไม่มี กรุณาพิมพ์ว่า ไม่มี"
      >${escapeHtml(
        data.HospitalHistory || ""
      )}</textarea>


    </div>


    <div class="user-id">

      LINE USER ID

      <br>

      ${escapeHtml(
        lineUser.userId
      )}

    </div>


    <button
      class="button"
      onclick="nextStep()"
    >

      ดำเนินการต่อ →

    </button>

  `;

}

// ============================================
// NEXT STEP
// ============================================

function nextStep() {

  // ==========================================
  // ชื่อ - นามสกุล
  // ==========================================

  const fullName =
    getRequiredValue(
      "fullName",
      "กรุณากรอกชื่อ - นามสกุล"
    );

  if (fullName === null) return;


  // ==========================================
  // เลขบัตรประชาชน
  // ==========================================

  const idCard =
    getRequiredValue(
      "idCard",
      "กรุณากรอกเลขบัตรประชาชน"
    );

  if (idCard === null) return;


  // ตรวจเลขบัตร 13 หลัก
  const cleanIDCard =
    idCard.replace(/\D/g, "");

  if (cleanIDCard.length !== 13) {

    alert(
      "เลขบัตรประชาชนต้องมี 13 หลัก"
    );

    document
      .getElementById("idCard")
      .focus();

    return;

  }


  // ==========================================
  // เลขหลังบัตร
  // ==========================================

  const laserID =
    getRequiredValue(
      "laserID",
      "กรุณากรอกเลขหลังบัตรประชาชน"
    );

  if (laserID === null) return;


  // ==========================================
  // วันเดือนปีเกิด
  // ==========================================

  const birthDate =
    getRequiredValue(
      "birthDate",
      "กรุณากรอกวันเดือนปีเกิด"
    );

  if (birthDate === null) return;


  // ==========================================
  // วันหมดอายุบัตร
  // ==========================================

  const idExpireDate =
    getRequiredValue(
      "idExpireDate",
      "กรุณากรอกวันหมดอายุบัตรประชาชน"
    );

  if (idExpireDate === null) return;


  // ==========================================
  // สัญชาติ
  // ==========================================

  const nationality =
    getRequiredValue(
      "nationality",
      "กรุณากรอกสัญชาติ"
    );

  if (nationality === null) return;


  // ==========================================
  // เบอร์โทรศัพท์
  // ==========================================

  const phone =
    getRequiredValue(
      "phone",
      "กรุณากรอกเบอร์โทรศัพท์"
    );

  if (phone === null) return;


  // ตรวจเบอร์โทร
  const cleanPhone =
    phone.replace(/\D/g, "");

  if (
    cleanPhone.length !== 10 ||
    !cleanPhone.startsWith("0")
  ) {

    alert(
      "กรุณากรอกเบอร์โทรศัพท์ให้ถูกต้อง เช่น 0812345678"
    );

    document
      .getElementById("phone")
      .focus();

    return;

  }


  // ==========================================
  // น้ำหนัก
  // ==========================================

  const weight =
    getRequiredValue(
      "weight",
      "กรุณากรอกน้ำหนัก"
    );

  if (weight === null) return;


  if (
    Number(weight) <= 0 ||
    Number(weight) > 500
  ) {

    alert(
      "กรุณาตรวจสอบน้ำหนักอีกครั้ง"
    );

    document
      .getElementById("weight")
      .focus();

    return;

  }


  // ==========================================
  // ส่วนสูง
  // ==========================================

  const height =
    getRequiredValue(
      "height",
      "กรุณากรอกส่วนสูง"
    );

  if (height === null) return;


  if (
    Number(height) <= 0 ||
    Number(height) > 250
  ) {

    alert(
      "กรุณาตรวจสอบส่วนสูงอีกครั้ง"
    );

    document
      .getElementById("height")
      .focus();

    return;

  }


  // ==========================================
  // โรคประจำตัว
  // ==========================================

  const disease =
    getRequiredValue(
      "disease",
      "กรุณาระบุโรคประจำตัว\nหากไม่มี กรุณาพิมพ์ว่า ไม่มี"
    );

  if (disease === null) return;


  // ==========================================
  // ประวัติการรักษา
  // ไม่ Required
  // ==========================================

  const hospitalHistoryElement =
    document.getElementById(
      "hospitalHistory"
    );


  const hospitalHistory =
    hospitalHistoryElement
      ? hospitalHistoryElement.value.trim()
      : "";


  // ==========================================
  // Email
  // ==========================================

  const emailElement =
    document.getElementById(
      "email"
    );
  const emailElement =
    getRequiredValue(
      "email",
      "กรุณากรอกอีเมล"
    );

  if (emailElement === null) return;

  const email =
    emailElement
      ? emailElement.value.trim()
      : "";


  // ==========================================
  // บันทึกข้อมูลลง applicationData
  // ==========================================

  applicationData.FullName =
    fullName;

  applicationData.IDCard =
    cleanIDCard;

  applicationData.LaserID =
    laserID;

  applicationData.BirthDate =
    birthDate;

  applicationData.IDExpireDate =
    idExpireDate;

  applicationData.Nationality =
    nationality;

  applicationData.Phone =
    cleanPhone;

  applicationData.Email =
    email;

  applicationData.Weight =
    weight;

  applicationData.Height =
    height;

  applicationData.Disease =
    disease;

  applicationData.HospitalHistory =
    hospitalHistory;


  // ==========================================
  // DEBUG
  // ==========================================

  console.log(
    "APPLICATION DATA UPDATED"
  );


  // ==========================================
  // ไป STEP 2
  // ==========================================

  showPaymentForm();

}
  
// ============================================
// PAYMENT FORM
// ============================================

function showPaymentForm() {

  const app =
    document.getElementById("app");


  const data =
    applicationData || {};


  app.innerHTML = `

    <div class="section">

      <div class="section-title">
        💳 วิธีการชำระเบี้ย
      </div>

      <div style="
        color:#777;
        margin-bottom:18px;
      ">
        เลือกช่องทางการชำระเงินที่สะดวก
      </div>


      <!-- ================================= -->
      <!-- QR CODE -->
      <!-- ================================= -->

      <div
        class="payment-option
          ${
            data.PaymentMethod ===
            "QR Code ออนไลน์"
              ? "selected"
              : ""
          }
        "
        onclick="
          selectPayment(
            'QR Code ออนไลน์'
          )
        "
        id="payment-qr"
      >

        <div style="
          font-size:28px;
        ">
          📱
        </div>

        <div>

          <div style="
            font-weight:bold;
            font-size:16px;
          ">
            QR Code ออนไลน์
          </div>

          <div style="
            color:#777;
            font-size:13px;
            margin-top:4px;
          ">
            ชำระผ่าน QR Code
          </div>

        </div>

      </div>


      <!-- ================================= -->
      <!-- CREDIT CARD -->
      <!-- ================================= -->

      <div
        class="payment-option
          ${
            data.PaymentMethod ===
            "บัตรเครดิต"
              ? "selected"
              : ""
          }
        "
        onclick="
          selectPayment(
            'บัตรเครดิต'
          )
        "
        id="payment-card"
      >

        <div style="
          font-size:28px;
        ">
          💳
        </div>

        <div>

          <div style="
            font-weight:bold;
            font-size:16px;
          ">
            บัตรเครดิต
          </div>

          <div style="
            color:#777;
            font-size:13px;
            margin-top:4px;
          ">
            ชำระผ่านบัตรเครดิต
          </div>

        </div>

      </div>


      <!-- ================================= -->
      <!-- FREQUENCY -->
      <!-- ================================= -->

      <div class="section">

        <div class="section-title">
          📅 ความถี่การชำระ
        </div>


        <div class="frequency-grid">


          <button
            class="
              frequency-button
              ${
                data.PaymentFrequency ===
                "รายปี"
                  ? "selected"
                  : ""
              }
            "
            onclick="
              selectFrequency('รายปี')
            "
            id="freq-year"
          >

            📅 รายปี

          </button>


          <button
            class="
              frequency-button
              ${
                data.PaymentFrequency ===
                "ราย 6 เดือน"
                  ? "selected"
                  : ""
              }
            "
            onclick="
              selectFrequency(
                'ราย 6 เดือน'
              )
            "
            id="freq-6m"
          >

            📆 ราย 6 เดือน

          </button>


          <button
            class="
              frequency-button
              ${
                data.PaymentFrequency ===
                "ราย 3 เดือน"
                  ? "selected"
                  : ""
              }
            "
            onclick="
              selectFrequency(
                'ราย 3 เดือน'
              )
            "

function selectPayment(method) {

  applicationData.PaymentMethod =
    method;


  // เอา selected ออกจากทุกตัว

  document
    .querySelectorAll(
      ".payment-option"
    )
    .forEach(el => {

      el.classList.remove(
        "selected"
      );

    });


  // ใส่ selected ให้ตัวที่เลือก

  if (
    method ===
    "QR Code ออนไลน์"
  ) {

    document
      .getElementById(
        "payment-qr"
      )
      ?.classList.add(
        "selected"
      );

  }


  if (
    method ===
    "บัตรเครดิต"
  ) {

    document
      .getElementById(
        "payment-card"
      )
      ?.classList.add(
        "selected"
      );

  }

}

// ============================================
// SELECT FREQUENCY
// ============================================

function selectFrequency(frequency) {

  applicationData.PaymentFrequency =
    frequency;


  // เอา selected ออกจากทุกปุ่ม

  document
    .querySelectorAll(
      ".frequency-button"
    )
    .forEach(btn => {

      btn.classList.remove(
        "selected"
      );

    });


  // หา ID ของปุ่ม

  let id = "";


  if (
    frequency ===
    "รายปี"
  ) {

    id = "freq-year";

  }


  if (
    frequency ===
    "ราย 6 เดือน"
  ) {

    id = "freq-6m";

  }


  if (
    frequency ===
    "ราย 3 เดือน"
  ) {

    id = "freq-3m";

  }


  if (id) {

    document
      .getElementById(id)
      ?.classList.add(
        "selected"
      );

  }

}

function updateBeneficiary(
  index,
  field,
  value
) {

  if (
    !beneficiaries[index]
  ) return;


  beneficiaries[index][field] =
    value.trim();

}

function removeBeneficiary(index) {

  beneficiaries.splice(
    index,
    1
  );


  renderBeneficiaries();

}

      [];

    return;

  }


  // ตรวจข้อมูลแต่ละคน

  for (
    let i = 0;
    i < beneficiaries.length;
    i++
  ) {

    const b =
      beneficiaries[i];


    if (!b.FullName) {

      alert(
        `กรุณากรอกชื่อผู้รับผลประโยชน์คนที่ ${i + 1}`
      );

      return;

    }


    if (!b.Relationship) {

      alert(
        `กรุณาเลือกความสัมพันธ์ของผู้รับผลประโยชน์คนที่ ${i + 1}`
      );

      return;

    }


    if (!b.Age) {

      alert(
        `กรุณากรอกอายุผู้รับผลประโยชน์คนที่ ${i + 1}`
      );

      return;

    }


    if (!b.IDCard) {

      alert(
        `กรุณากรอกเลขบัตรประชาชนของผู้รับผลประโยชน์คนที่ ${i + 1}`
      );

      return;

    }


    if (
      b.IDCard.length !== 13
    ) {

      alert(
        `เลขบัตรประชาชนของผู้รับผลประโยชน์คนที่ ${i + 1} ต้องมี 13 หลัก`
      );

      return;

    }

  }


  // เก็บข้อมูล

  applicationData.Beneficiaries =
    beneficiaries;


  console.log(
    "APPLICATION DATA:",
    applicationData
  );


  // ไปหน้าสรุป
  showSummary();

}

function formatAddress(address) {

  if (!address) {

    return "-";

  }


  const parts = [

    address.HouseNo
      ? `บ้านเลขที่ ${address.HouseNo}`
      : "",

    address.Moo
      ? `หมู่ ${address.Moo}`
      : "",

    address.Soi
      ? `ซอย ${address.Soi}`
      : "",

    address.Road
      ? `ถนน ${address.Road}`
      : "",

    address.SubDistrict
      ? `ตำบล/แขวง ${address.SubDistrict}`
      : "",

    address.District
      ? `อำเภอ/เขต ${address.District}`
      : "",

    address.Province
      ? `จังหวัด ${address.Province}`
      : "",

    address.PostalCode
      ? `รหัสไปรษณีย์ ${address.PostalCode}`
      : ""

  ];


  return parts
    .filter(Boolean)
    .join(" ");

}
  
// ============================================

function setStatus(message) {

  document.getElementById(
    "status"
  ).innerHTML = message;

}

function requiredLabel(text) {

  return `
    <label>
      ${text}
      <span class="required">*</span>
    </label>
  `;

}

function getRequiredValue(id, message) {

  const element =
    document.getElementById(id);

  if (!element) {

    return "";

  }

  const value =
    element.value.trim();

  if (!value) {

    alert(message);

    element.focus();

    return null;

  }

  return value;

}

// ============================================
// SECURITY
// ============================================

function escapeHtml(value) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}
