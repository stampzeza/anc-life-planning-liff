<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ANC Life Planning</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;

      font-family:
        Arial,
        "Noto Sans Thai",
        sans-serif;

      background: #f5f7fa;
      color: #222;
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
    }

    .card {
      background: #fff;

      border-radius: 24px;

      padding: 28px 22px;

      box-shadow:
        0 8px 30px
        rgba(0,0,0,0.08);
    }

    .logo {
      text-align: center;

      font-size: 50px;

      margin-bottom: 8px;
    }

    h1 {
      text-align: center;

      margin: 0;

      font-size: 24px;
    }

    .subtitle {
      text-align: center;

      color: #777;

      margin-top: 8px;

      margin-bottom: 25px;
    }

    .welcome {
      background: #f5f7fa;

      border-radius: 16px;

      padding: 18px;

      margin-bottom: 20px;
    }

    .welcome-title {
      font-size: 14px;

      color: #777;

      margin-bottom: 5px;
    }

    .welcome-name {
      font-size: 20px;

      font-weight: bold;
    }

    .section {
      margin-top: 20px;
    }

    .section-title {
      font-size: 18px;

      font-weight: bold;

      margin-bottom: 12px;
    }

    label {
      display: block;

      margin-top: 14px;

      margin-bottom: 6px;

      font-size: 14px;

      color: #555;
    }

    input,
    textarea {

      width: 100%;

      padding: 13px 14px;

      border: 1px solid #ddd;

      border-radius: 12px;

      font-size: 16px;

      outline: none;

      font-family: inherit;

      background: #fff;

    }

    input:focus,
    textarea:focus {

      border-color: #999;

    }

    textarea {

      min-height: 90px;

      resize: vertical;

    }

    .user-id {

      margin-top: 20px;

      padding: 12px;

      background: #f8f8f8;

      border-radius: 10px;

      font-size: 11px;

      color: #777;

      word-break: break-all;

    }

    .button {

      width: 100%;

      border: none;

      border-radius: 14px;

      padding: 15px;

      margin-top: 25px;

      font-size: 17px;

      font-weight: bold;

      cursor: pointer;

      background: #111;

      color: white;

    }

    .button:active {

      transform: scale(0.98);

    }

    .status {

      text-align: center;

      color: #777;

      margin-bottom: 20px;

    }

    .error {

      padding: 15px;

      background: #fef2f2;

      color: #991b1b;

      border-radius: 12px;

      margin-top: 15px;

    }

    .payment-option {

    display: flex;
  
    align-items: center;
  
    gap: 15px;
  
    padding: 16px;
  
    margin-bottom: 12px;
  
    border: 2px solid #eee;
  
    border-radius: 16px;
  
    cursor: pointer;
  
    transition: 0.2s;
  
    }
    
    .payment-option.selected {
    
      border-color: #111;
    
      background: #f5f5f5;
    
    }
    
    
    .frequency-grid {
    
      display: grid;
    
      grid-template-columns: 1fr;
    
      gap: 10px;
    
    }
    
    
    .frequency-button {
    
      padding: 14px;
    
      border: 2px solid #eee;
    
      border-radius: 14px;
    
      background: white;
    
      font-size: 16px;
    
      cursor: pointer;
    
    }
    
    
    .frequency-button.selected {
    
      border-color: #111;
    
      background: #f5f5f5;
    
    }
  
    .summary-card {
  
    margin-bottom:16px;
  
    padding:16px;
  
    border:1px solid #eee;
  
    border-radius:16px;
  
    background:#fff;
  
    line-height:1.8;
  
  }
  
  .summary-title {
  
    font-size:17px;
  
    font-weight:bold;
  
    margin-bottom:10px;
  
    padding-bottom:8px;
  
    border-bottom:1px solid #eee;
  
  }
  
  .required {
    color: #e53935;
    font-weight: bold;
    margin-left: 3px;
  }

  /* ============================================
   REVIEW
   ============================================ */

  .review-row {
    padding:10px 0;
    border-bottom:1px solid #eeeeee;
  }
  
  .review-row:last-child {
    border-bottom:none;
  }
  
  .review-label {
    color:#888;
    font-size:13px;
    margin-bottom:4px;
  }
  
  .review-value {
    color:#222;
    font-size:15px;
    font-weight:500;
    word-break:break-word;
  }
  </style>

</head>


<body>

<div class="container">

  <div class="card">

    <div class="logo">
      🎉
    </div>

    <h1>
      ANC Life Planning
    </h1>

    <div class="subtitle">
      ระบบสมัครประกันออนไลน์
    </div>


    <div
      id="status"
      class="status"
    >
      🔄 กำลังเชื่อมต่อ LINE...
    </div>


    <div id="app"></div>

  </div>

</div>


<script>


// ============================================
// LIFF CONFIG
// ============================================

const LIFF_ID =
  "2011077014-4bdad1VJ";


// ============================================
// GLOBAL USER
// ============================================

let lineUser = null;

let applicationData = {

  USER_ID: "",
  DisplayName: "",

  // =========================
  // ข้อมูลผู้สมัคร
  // =========================

  FullName: "",
  IDCard: "",
  LaserID: "",
  BirthDate: "",
  IDExpireDate: "",
  Nationality: "",
  Phone: "",
  Email: "",

  Weight: "",
  Height: "",
  Disease: "",
  HospitalHistory: "",

  // =========================
  // การชำระเงิน
  // =========================

  PaymentMethod: "",
  PaymentFrequency: "",

  // =========================
  // การทำงาน
  // =========================

  Occupation: "",
  Company: "",
  WorkAddress: "",
  WorkPhone: "",
  Position: "",
  JobDescription: "",
  AnnualIncome: "",

  // =========================
  // ที่อยู่
  // =========================

  CurrentAddress: null,
  HouseAddress: null,
  SameAddress: false,

  // =========================
  // ผู้รับผลประโยชน์
  // =========================

  Beneficiaries: []

};

let beneficiaries = [];

// ============================================
// START LIFF
// ============================================

async function main() {

  try {

    setStatus(
      "🔄 กำลังเริ่มต้น LIFF..."
    );


    // ------------------------------------------
    // Initialize
    // ------------------------------------------

    await liff.init({

      liffId: LIFF_ID

    });


    // ------------------------------------------
    // Login
    // ------------------------------------------

    if (!liff.isLoggedIn()) {

      setStatus(
        "🔐 กำลังเข้าสู่ระบบ LINE..."
      );

      liff.login();

      return;

    }


    // ------------------------------------------
    // Get Profile
    // ------------------------------------------

    setStatus(
      "🔄 กำลังอ่านข้อมูล LINE..."
    );


    const profile =
      await liff.getProfile();


    lineUser = {

      userId:
        profile.userId,

      displayName:
        profile.displayName,

      pictureUrl:
        profile.pictureUrl || ""

    };


    console.log(
      "LINE USER:",
      lineUser
    );


    // ------------------------------------------
    // Show Application Form
    // ------------------------------------------

    setStatus(
      "✅ เชื่อมต่อ LINE สำเร็จ"
    );


    showApplicationForm();


  } catch (error) {

    console.error(error);


    setStatus(
      "❌ เกิดข้อผิดพลาด"
    );


    document.getElementById(
      "app"
    ).innerHTML = `

      <div class="error">

        ไม่สามารถเชื่อมต่อ LINE ได้

        <br><br>

        ${escapeHtml(
          error.message ||
          error.toString()
        )}

      </div>

    `;

  }

}

// ============================================
// APPLICATION FORM
// ============================================

function showApplicationForm() {

  const app =
    document.getElementById("app");


  // ==========================================
  // ค่าที่เคยกรอกไว้
  // ==========================================

  const data = applicationData || {};


  app.innerHTML = `

    <div class="welcome">

      <div class="welcome-title">
        ยินดีต้อนรับครับ
      </div>

      <div class="welcome-name">
        ${escapeHtml(
          lineUser.displayName
        )}
      </div>

    </div>


    <div class="section">

      <div class="section-title">
        📝 ข้อมูลผู้สมัคร
      </div>


      <!-- ================================= -->
      <!-- ชื่อ -->
      <!-- ================================= -->

      <label>
        ชื่อ - นามสกุล
        <span class="required">*</span>
      </label>

      <input
        id="fullName"
        type="text"
        placeholder="กรุณากรอกชื่อ - นามสกุล"
        value="${escapeHtml(
          data.FullName || ""
        )}"
      >


      <!-- ================================= -->
      <!-- เลขบัตรประชาชน -->
      <!-- ================================= -->

      <label>
        เลขบัตรประชาชน
        <span class="required">*</span>
      </label>

      <input
        id="idCard"
        type="text"
        inputmode="numeric"
        maxlength="13"
        placeholder="เลขบัตรประชาชน 13 หลัก"
        value="${escapeHtml(
          data.IDCard || ""
        )}"
      >


      <!-- ================================= -->
      <!-- เลขหลังบัตร -->
      <!-- ================================= -->

      <label>
        เลขหลังบัตรประชาชน
        <span class="required">*</span>
      </label>

      <input
        id="laserID"
        type="text"
        placeholder="เช่น ME1-1234567-89"
        value="${escapeHtml(
          data.LaserID || ""
        )}"
      >


      <!-- ================================= -->
      <!-- วันเกิด -->
      <!-- ================================= -->

      <label>
        วันเดือนปีเกิด
        <span class="required">*</span>
      </label>

      <input
        id="birthDate"
        type="date"
        value="${escapeHtml(
          data.BirthDate || ""
        )}"
      >


      <!-- ================================= -->
      <!-- วันหมดอายุ -->
      <!-- ================================= -->

      <label>
        วันหมดอายุบัตรประชาชน
        <span class="required">*</span>
      </label>

      <input
        id="idExpireDate"
        type="date"
        value="${escapeHtml(
          data.IDExpireDate || ""
        )}"
      >


      <!-- ================================= -->
      <!-- สัญชาติ -->
      <!-- ================================= -->

      <label>
        สัญชาติ
        <span class="required">*</span>
      </label>

      <input
        id="nationality"
        type="text"
        placeholder="เช่น ไทย"
        value="${escapeHtml(
          data.Nationality || "ไทย"
        )}"
      >


      <!-- ================================= -->
      <!-- เบอร์โทร -->
      <!-- ================================= -->

      <label>
        เบอร์โทรศัพท์
        <span class="required">*</span>
      </label>

      <input
        id="phone"
        type="tel"
        inputmode="numeric"
        maxlength="10"
        placeholder="08xxxxxxxx"
        value="${escapeHtml(
          data.Phone || ""
        )}"
      >


      <!-- ================================= -->
      <!-- Email -->
      <!-- ================================= -->

      <label>
        อีเมล
        <span class="required">*</span>
      </label>

      <input
        id="email"
        type="email"
        placeholder="example@email.com"
        value="${escapeHtml(
          data.Email || ""
        )}"
      >


      <!-- ================================= -->
      <!-- น้ำหนัก -->
      <!-- ================================= -->

      <label>
        น้ำหนัก (กก.)
        <span class="required">*</span>
      </label>

      <input
        id="weight"
        type="number"
        inputmode="decimal"
        placeholder="เช่น 70"
        value="${escapeHtml(
          data.Weight || ""
        )}"
      >


      <!-- ================================= -->
      <!-- ส่วนสูง -->
      <!-- ================================= -->

      <label>
        ส่วนสูง (ซม.)
        <span class="required">*</span>
      </label>

      <input
        id="height"
        type="number"
        inputmode="numeric"
        placeholder="เช่น 170"
        value="${escapeHtml(
          data.Height || ""
        )}"
      >


      <!-- ================================= -->
      <!-- โรคประจำตัว -->
      <!-- ================================= -->

      <label>
        โรคประจำตัว
        <span class="required">*</span>
      </label>

      <textarea
        id="disease"
        placeholder="หากไม่มี กรุณาพิมพ์ว่า ไม่มี"
      >${escapeHtml(
        data.Disease || ""
      )}</textarea>


      <!-- ================================= -->
      <!-- ประวัติรักษา -->
      <!-- ================================= -->

      <label>
        ประวัติการรักษาในโรงพยาบาล
      </label>

      <textarea
        id="hospitalHistory"
        placeholder="หากไม่มี กรุณาพิมพ์ว่า ไม่มี"
      >${escapeHtml(
        data.HospitalHistory || ""
      )}</textarea>


    </div>


    <div class="user-id">

      LINE USER ID

      <br>

      ${escapeHtml(
        lineUser.userId
      )}

    </div>


    <button
      class="button"
      onclick="nextStep()"
    >

      ดำเนินการต่อ →

    </button>

  `;

}

// ============================================
// NEXT STEP
// ============================================

function nextStep() {

  // ==========================================
  // ชื่อ - นามสกุล
  // ==========================================

  const fullName =
    getRequiredValue(
      "fullName",
      "กรุณากรอกชื่อ - นามสกุล"
    );

  if (fullName === null) return;


  // ==========================================
  // เลขบัตรประชาชน
  // ==========================================

  const idCard =
    getRequiredValue(
      "idCard",
      "กรุณากรอกเลขบัตรประชาชน"
    );

  if (idCard === null) return;


  // ตรวจเลขบัตร 13 หลัก
  const cleanIDCard =
    idCard.replace(/\D/g, "");

  if (cleanIDCard.length !== 13) {

    alert(
      "เลขบัตรประชาชนต้องมี 13 หลัก"
    );

    document
      .getElementById("idCard")
      .focus();

    return;

  }


  // ==========================================
  // เลขหลังบัตร
  // ==========================================

  const laserID =
    getRequiredValue(
      "laserID",
      "กรุณากรอกเลขหลังบัตรประชาชน"
    );

  if (laserID === null) return;


  // ==========================================
  // วันเดือนปีเกิด
  // ==========================================

  const birthDate =
    getRequiredValue(
      "birthDate",
      "กรุณากรอกวันเดือนปีเกิด"
    );

  if (birthDate === null) return;


  // ==========================================
  // วันหมดอายุบัตร
  // ==========================================

  const idExpireDate =
    getRequiredValue(
      "idExpireDate",
      "กรุณากรอกวันหมดอายุบัตรประชาชน"
    );

  if (idExpireDate === null) return;


  // ==========================================
  // สัญชาติ
  // ==========================================

  const nationality =
    getRequiredValue(
      "nationality",
      "กรุณากรอกสัญชาติ"
    );

  if (nationality === null) return;


  // ==========================================
  // เบอร์โทรศัพท์
  // ==========================================

  const phone =
    getRequiredValue(
      "phone",
      "กรุณากรอกเบอร์โทรศัพท์"
    );

  if (phone === null) return;


  // ตรวจเบอร์โทร
  const cleanPhone =
    phone.replace(/\D/g, "");

  if (
    cleanPhone.length !== 10 ||
    !cleanPhone.startsWith("0")
  ) {

    alert(
      "กรุณากรอกเบอร์โทรศัพท์ให้ถูกต้อง เช่น 0812345678"
    );

    document
      .getElementById("phone")
      .focus();

    return;

  }

  // ==========================================
  // Email
  // ==========================================

  const emailElement =
    document.getElementById(
      "email"
    );
  
  const email =
    emailElement
      ? emailElement.value.trim()
      : "";


  // ==========================================
  // น้ำหนัก
  // ==========================================

  const weight =
    getRequiredValue(
      "weight",
      "กรุณากรอกน้ำหนัก"
    );

  if (weight === null) return;


  if (
    Number(weight) <= 0 ||
    Number(weight) > 500
  ) {

    alert(
      "กรุณาตรวจสอบน้ำหนักอีกครั้ง"
    );

    document
      .getElementById("weight")
      .focus();

    return;

  }


  // ==========================================
  // ส่วนสูง
  // ==========================================

  const height =
    getRequiredValue(
      "height",
      "กรุณากรอกส่วนสูง"
    );

  if (height === null) return;


  if (
    Number(height) <= 0 ||
    Number(height) > 250
  ) {

    alert(
      "กรุณาตรวจสอบส่วนสูงอีกครั้ง"
    );

    document
      .getElementById("height")
      .focus();

    return;

  }


  // ==========================================
  // โรคประจำตัว
  // ==========================================

  const disease =
    getRequiredValue(
      "disease",
      "กรุณาระบุโรคประจำตัว\nหากไม่มี กรุณาพิมพ์ว่า ไม่มี"
    );

  if (disease === null) return;


  // ==========================================
  // ประวัติการรักษา
  // ไม่ Required
  // ==========================================

  const hospitalHistoryElement =
    document.getElementById(
      "hospitalHistory"
    );


  const hospitalHistory =
    hospitalHistoryElement
      ? hospitalHistoryElement.value.trim()
      : "";

  // ==========================================
  // บันทึกข้อมูลลง applicationData
  // ==========================================

  applicationData.FullName =
    fullName;

  applicationData.IDCard =
    cleanIDCard;

  applicationData.LaserID =
    laserID;

  applicationData.BirthDate =
    birthDate;

  applicationData.IDExpireDate =
    idExpireDate;

  applicationData.Nationality =
    nationality;

  applicationData.Phone =
    cleanPhone;

  applicationData.Email =
    email;

  applicationData.Weight =
    weight;

  applicationData.Height =
    height;

  applicationData.Disease =
    disease;

  applicationData.HospitalHistory =
    hospitalHistory;


  // ==========================================
  // DEBUG
  // ==========================================

  console.log(
    "APPLICATION DATA UPDATED"
  );


  // ==========================================
  // ไป STEP 2
  // ==========================================

  showPaymentForm();

}
  
// ============================================
// PAYMENT FORM
// ============================================

  const app =
    document.getElementById("app");


  const data =
    applicationData || {};


  app.innerHTML = `

    <div class="section">

      <!-- ================================= -->

      <div
        class="payment-option

      >

        <div style="
          font-size:28px;
        ">
          📱
        </div>

        <div>

            font-size:16px;
          ">

          </div>

          <div style="

            font-size:13px;
            margin-top:4px;
          ">

          </div>

      >

        <div style="

        ">

        </div>

        <div>

          <div style="
            font-weight:bold;
            font-size:16px;

            บัตรเครดิต
          </div>

          <div style="

            font-size:13px;
            margin-top:4px;
          ">

          </div>

        </div>

      </div>


      <!-- ================================= -->
      <!-- FREQUENCY -->
      <!-- ================================= -->

      <div class="section">

        <div class="section-title">
          📅 ความถี่การชำระ
        </div>


        <div class="frequency-grid">


          <button
            class="
              frequency-button
              ${
                data.PaymentFrequency ===
                "รายปี"
                  ? "selected"
                  : ""
              }
            "
            onclick="
              selectFrequency('รายปี')

            id="freq-year"
          >

          </button>


          <button
            class="
              frequency-button
              ${
                data.PaymentFrequency ===
                "ราย 6 เดือน"
                  ? "selected"
                  : ""
              }
            "
            onclick="
              selectFrequency(
                'ราย 6 เดือน'
              )
            "
            id="freq-6m"
          >

// ============================================
// SELECT PAYMENT
// ============================================

function selectPayment(method) {

  applicationData.PaymentMethod =
    method;


  // เอา selected ออกจากทุกตัว

  document
    .querySelectorAll(
      ".payment-option"
    )
    .forEach(el => {

      el.classList.remove(
        "selected"
      );

    });


  // ใส่ selected ให้ตัวที่เลือก

  if (
    method ===
    "QR Code ออนไลน์"
  ) {

    document
      .getElementById(
        "payment-qr"
      )
      ?.classList.add(
        "selected"
      );

  }


  if (
    method ===
    "บัตรเครดิต"
  ) {

    document
      .getElementById(
        "payment-card"
      )
      ?.classList.add(
        "selected"
      );

  }

}

// ============================================
// SELECT FREQUENCY
// ============================================

function selectFrequency(frequency) {

  applicationData.PaymentFrequency =
    frequency;


  // เอา selected ออกจากทุกปุ่ม

  document
    .querySelectorAll(
      ".frequency-button"
    )
    .forEach(btn => {

      btn.classList.remove(
        "selected"
      );

    });


  // หา ID ของปุ่ม

  let id = "";


  if (
    frequency ===
    "รายปี"
  ) {

    id = "freq-year";

  }


  if (
    frequency ===
    "ราย 6 เดือน"
  ) {

    id = "freq-6m";

  }


  if (
    frequency ===
    "ราย 3 เดือน"
  ) {

    id = "freq-3m";

  }


  if (id) {

    document
      .getElementById(id)
      ?.classList.add(
        "selected"
      );

  }

}

function occupationChanged() {

  const occupation =
    document.getElementById(
      "occupation"
    ).value;


  // เก็บอาชีพทันที

  applicationData.Occupation =
    occupation;


  const workFields =
    document.getElementById(
      "workFields"
    );


  if (!workFields) return;


  if (occupation) {

    workFields.style.display =
      "block";

  } else {

    workFields.style.display =
      "none";

  }

}
  
// ============================================
// NEXT WORK STEP
// ============================================

function nextWorkStep() {

  // ==========================================
  // อาชีพ
  // ==========================================

  const occupation =
    document.getElementById(
      "occupation"
    ).value.trim();

  if (!occupation) {

    alert(
      "กรุณาเลือกอาชีพปัจจุบัน"
    );

    document
      .getElementById("occupation")
      .focus();

    return;

  }


  // ==========================================
  // สถานที่ทำงาน
  // ==========================================

  const company =
    getRequiredValue(
      "company",
      "กรุณากรอกสถานที่ทำงาน"
    );

  if (company === null) return;


  // ==========================================
  // ที่อยู่ที่ทำงาน
  // ==========================================

  const workAddress =
    getRequiredValue(
      "workAddress",
      "กรุณากรอกที่อยู่ที่ทำงาน"
    );

  if (workAddress === null) return;


  // ==========================================
  // เบอร์โทรศัพท์ที่ทำงาน
  // ==========================================

  const workPhone =
    getRequiredValue(
      "workPhone",
      "กรุณากรอกเบอร์โทรศัพท์ที่ทำงาน"
    );

  if (workPhone === null) return;


  // ตรวจเบอร์โทรศัพท์ที่ทำงาน
  const cleanWorkPhone =
    workPhone.replace(/\D/g, "");


  if (
    cleanWorkPhone.length < 9 ||
    cleanWorkPhone.length > 10
  ) {

    alert(
      "กรุณาตรวจสอบเบอร์โทรศัพท์ที่ทำงาน"
    );

    document
      .getElementById("workPhone")
      .focus();

    return;

  }


  // ==========================================
  // ตำแหน่ง
  // ==========================================

  const position =
    getRequiredValue(
      "position",
      "กรุณากรอกตำแหน่ง"
    );

  if (position === null) return;


  // ==========================================
  // ลักษณะงาน
  // ==========================================

  const jobDescription =
    getRequiredValue(
      "jobDescription",
      "กรุณากรอกลักษณะงาน"
    );

  if (jobDescription === null) return;


  // ==========================================
  // รายได้ต่อปี
  // ==========================================

  const annualIncome =
    getRequiredValue(
      "annualIncome",
      "กรุณากรอกรายได้ต่อปี"
    );

  if (annualIncome === null) return;


  // ตรวจรายได้
  if (
    Number(annualIncome) <= 0
  ) {

    alert(
      "กรุณาตรวจสอบรายได้ต่อปี"
    );

    document
      .getElementById("annualIncome")
      .focus();

    return;

  }


  // ==========================================
  // บันทึกข้อมูล
  // ==========================================

  applicationData.Occupation =
    occupation;

  applicationData.Company =
    company;

  applicationData.WorkAddress =
    workAddress;

  applicationData.WorkPhone =
    cleanWorkPhone;

  applicationData.Position =
    position;

  applicationData.JobDescription =
    jobDescription;

  applicationData.AnnualIncome =
    annualIncome;


  // ==========================================
  // DEBUG
  // ==========================================

  console.log(
    "WORK DATA SAVED"
  );


  // ==========================================
  // ไป STEP 4
  // ==========================================

  showAddressForm();

}

function sameAddressChanged() {

  const checkbox =
    document.getElementById(
      "sameAddress"
    );

  const fields =
    document.getElementById(
      "houseAddressFields"
    );

  if (!checkbox || !fields) {
    return;
  }


  if (checkbox.checked) {

    // ========================================
    // คัดลอก Current → House
    // ========================================

    const currentAddress = {

      houseNo:
        document
          .getElementById(
            "currentHouseNo"
          )
          .value.trim(),

      moo:
        document
          .getElementById(
            "currentMoo"
          )
          .value.trim(),

      soi:
        document
          .getElementById(
            "currentSoi"
          )
          .value.trim(),

      road:
        document
          .getElementById(
            "currentRoad"
          )
          .value.trim(),

      subDistrict:
        document
          .getElementById(
            "currentSubDistrict"
          )
          .value.trim(),

      district:
        document
          .getElementById(
            "currentDistrict"
          )
          .value.trim(),

      province:
        document
          .getElementById(
            "currentProvince"
          )
          .value.trim(),

      postalCode:
        document
          .getElementById(
            "currentPostalCode"
          )
          .value.trim()

    };


    // ========================================
    // เก็บไว้ใน applicationData
    // ========================================

    applicationData.CurrentAddress =
      currentAddress;

    applicationData.HouseAddress =
      {
        ...currentAddress
      };

    applicationData.SameAddress =
      true;


    // ========================================
    // ซ่อนทะเบียนบ้าน
    // ========================================

    fields.style.display =
      "none";


  } else {

    applicationData.SameAddress =
      false;

    fields.style.display =
      "block";

  }

}

function nextAddressStep() {

  // ==========================================
  // อ่านที่อยู่ปัจจุบัน
  // ==========================================

  const currentAddress = {

    HouseNo:
      document.getElementById(
        "currentHouseNo"
      ).value.trim(),

    Moo:
      document.getElementById(
        "currentMoo"
      ).value.trim(),

    Soi:
      document.getElementById(
        "currentSoi"
      ).value.trim(),

    Road:
      document.getElementById(
        "currentRoad"
      ).value.trim(),

    SubDistrict:
      document.getElementById(
        "currentSubDistrict"
      ).value.trim(),

    District:
      document.getElementById(
        "currentDistrict"
      ).value.trim(),

    Province:
      document.getElementById(
        "currentProvince"
      ).value.trim(),

    PostalCode:
      document.getElementById(
        "currentPostalCode"
      ).value.trim()

  };


  // ==========================================
  // Validate ที่อยู่ปัจจุบัน
  // ==========================================

  if (!currentAddress.HouseNo) {

    alert(
      "กรุณากรอกบ้านเลขที่"
    );

    document
      .getElementById("currentHouseNo")
      .focus();

    return;
  }


  if (!currentAddress.SubDistrict) {

    alert(
      "กรุณากรอกตำบล / แขวง"
    );

    document
      .getElementById("currentSubDistrict")
      .focus();

    return;
  }


  if (!currentAddress.District) {

    alert(
      "กรุณากรอกอำเภอ / เขต"
    );

    document
      .getElementById("currentDistrict")
      .focus();

    return;
  }


  if (!currentAddress.Province) {

    alert(
      "กรุณากรอกจังหวัด"
    );

    document
      .getElementById("currentProvince")
      .focus();

    return;
  }


  if (!currentAddress.PostalCode) {

    alert(
      "กรุณากรอกรหัสไปรษณีย์"
    );

    document
      .getElementById("currentPostalCode")
      .focus();

    return;
  }


  // ตรวจรหัสไปรษณีย์
  if (
    !/^\d{5}$/.test(
      currentAddress.PostalCode
    )
  ) {

    alert(
      "กรุณากรอกรหัสไปรษณีย์ให้ถูกต้อง 5 หลัก"
    );

    document
      .getElementById("currentPostalCode")
      .focus();

    return;
  }


  // ==========================================
  // บันทึกที่อยู่ปัจจุบัน
  // ==========================================

  applicationData.CurrentAddress =
    currentAddress;


  // ==========================================
  // ตรวจว่าใช้ที่อยู่เดียวกันหรือไม่
  // ==========================================

  const sameAddress =
    document.getElementById(
      "sameAddress"
    ).checked;


  applicationData.SameAddress =
    sameAddress;


  // ==========================================
  // กรณีที่อยู่เหมือนกัน
  // ==========================================

  if (sameAddress) {

    applicationData.HouseAddress =
      {
        ...currentAddress
      };

  }


  // ==========================================
  // กรณีทะเบียนบ้านคนละที่อยู่
  // ==========================================

  else {

    const houseAddress = {

      HouseNo:
        document.getElementById(
          "houseHouseNo"
        ).value.trim(),

      Moo:
        document.getElementById(
          "houseMoo"
        ).value.trim(),

      Soi:
        document.getElementById(
          "houseSoi"
        ).value.trim(),

      Road:
        document.getElementById(
          "houseRoad"
        ).value.trim(),

      SubDistrict:
        document.getElementById(
          "houseSubDistrict"
        ).value.trim(),

      District:
        document.getElementById(
          "houseDistrict"
        ).value.trim(),

      Province:
        document.getElementById(
          "houseProvince"
        ).value.trim(),

      PostalCode:
        document.getElementById(
          "housePostalCode"
        ).value.trim()

    };


    // ========================================
    // Validate ทะเบียนบ้าน
    // ========================================

    if (!houseAddress.HouseNo) {

      alert(
        "กรุณากรอกบ้านเลขที่ตามทะเบียนบ้าน"
      );

      document
        .getElementById("houseHouseNo")
        .focus();

      return;
    }


    if (!houseAddress.SubDistrict) {

      alert(
        "กรุณากรอกตำบล / แขวงตามทะเบียนบ้าน"
      );

      document
        .getElementById("houseSubDistrict")
        .focus();

      return;
    }


    if (!houseAddress.District) {

      alert(
        "กรุณากรอกอำเภอ / เขตตามทะเบียนบ้าน"
      );

      document
        .getElementById("houseDistrict")
        .focus();

      return;
    }


    if (!houseAddress.Province) {

      alert(
        "กรุณากรอกจังหวัดตามทะเบียนบ้าน"
      );

      document
        .getElementById("houseProvince")
        .focus();

      return;
    }


    if (!houseAddress.PostalCode) {

      alert(
        "กรุณากรอกรหัสไปรษณีย์ตามทะเบียนบ้าน"
      );

      document
        .getElementById("housePostalCode")
        .focus();

      return;
    }


    // ตรวจรหัสไปรษณีย์

    if (
      !/^\d{5}$/.test(
        houseAddress.PostalCode
      )
    ) {

      alert(
        "กรุณากรอกรหัสไปรษณีย์ตามทะเบียนบ้านให้ถูกต้อง 5 หลัก"
      );

      document
        .getElementById("housePostalCode")
        .focus();

      return;
    }


    // ========================================
    // บันทึกทะเบียนบ้าน
    // ========================================

    applicationData.HouseAddress =
      houseAddress;

  }


  // ==========================================
  // DEBUG
  // ==========================================

  console.log(
    "ADDRESS DATA:",
    applicationData
  );


  // ==========================================
  // ไป STEP ถัดไป
  // ==========================================

  showBeneficiaryForm();

}

// BENEFICIARY FORM - STEP 2
// ============================================

function showBeneficiaryForm() {

  if (!Array.isArray(applicationData.Beneficiaries)) {
    applicationData.Beneficiaries = [];
  }

  // ถ้ายังไม่มีข้อมูล ให้สร้างคนที่ 1
  if (applicationData.Beneficiaries.length === 0) {

    applicationData.Beneficiaries.push({
      Name: "",
      Relation: "",
      Age: "",
      IDCard: ""
    });

  }

  renderBeneficiaries();

}

// ============================================
// ADD BENEFICIARY
// ============================================

function addBeneficiary() {

  if (
    applicationData.Beneficiaries.length >= 3
  ) {

    alert(
      "สามารถเพิ่มผู้รับผลประโยชน์ได้สูงสุด 3 คน"
    );

    return;
  }


  // ==========================================
  // เก็บข้อมูลคนปัจจุบันก่อนเพิ่มคนใหม่
  // ==========================================

  saveBeneficiaryFields();


  applicationData.Beneficiaries.push({

    Name: "",
    Relation: "",
    Age: "",
    IDCard: ""

  });


  renderBeneficiaries();

}

// ============================================
// SAVE BENEFICIARY FIELDS
// ============================================

function saveBeneficiaryFields() {

  const list =
    applicationData.Beneficiaries || [];


  list.forEach(function(person, index) {

    const name =
      document.getElementById(
        `beneficiaryName${index}`
      );

    const relation =
      document.getElementById(
        `beneficiaryRelation${index}`
      );

    const age =
      document.getElementById(
        `beneficiaryAge${index}`
      );

    const idCard =
      document.getElementById(
        `beneficiaryIDCard${index}`
      );


    if (name) {
      person.Name =
        name.value.trim();
    }


    if (relation) {
      person.Relation =
        relation.value.trim();
    }


    if (age) {
      person.Age =
        age.value.trim();
    }


    if (idCard) {
      person.IDCard =
        idCard.value.trim();
    }

  });

}

// ============================================
// REMOVE BENEFICIARY
// ============================================

function removeBeneficiary(index) {

  const list =
    applicationData.Beneficiaries || [];


  // ------------------------------------------
  // ป้องกัน index ผิด
  // ------------------------------------------

  if (
    index < 0 ||
    index >= list.length
  ) {

    return;

  }


  // ------------------------------------------
  // ต้องเหลืออย่างน้อย 1 คน
  // ------------------------------------------

  if (list.length <= 1) {

    alert(
      "ต้องมีผู้รับผลประโยชน์อย่างน้อย 1 คนครับ"
    );

    return;

  }


  // ------------------------------------------
  // ลบข้อมูล
  // ------------------------------------------

  list.splice(index, 1);


  // ------------------------------------------
  // Render ใหม่
  // ------------------------------------------

  applicationData.Beneficiaries =
    list;

  renderBeneficiaries();

}

function updateBeneficiary(
  index,
  field,
  value
) {

  if (
    !beneficiaries[index]
  ) return;


  beneficiaries[index][field] =
    value.trim();

}


// ============================================
// NEXT BENEFICIARY STEP
// ============================================

function nextBeneficiaryStep() {

  // บันทึกข้อมูลจากหน้าจอก่อน
  saveBeneficiaryFields();


  const list =
    applicationData.Beneficiaries || [];


  if (list.length === 0) {

    alert(
      "กรุณาเพิ่มผู้รับผลประโยชน์อย่างน้อย 1 คน"
    );

    return;

  }


  // ==========================================
  // ตรวจทีละคน
  // ==========================================

  for (
    let i = 0;
    i < list.length;
    i++
  ) {

    const person =
      list[i];


    if (!person.Name) {

      alert(
        `กรุณากรอกชื่อ - นามสกุล ผู้รับผลประโยชน์คนที่ ${i + 1}`
      );

      return;

    }


    if (!person.Relation) {

      alert(
        `กรุณากรอกความสัมพันธ์ ผู้รับผลประโยชน์คนที่ ${i + 1}`
      );

      return;

    }


    if (!person.Age) {

      alert(
        `กรุณากรอกอายุ ผู้รับผลประโยชน์คนที่ ${i + 1}`
      );

      return;

    }


    if (!person.IDCard) {

      alert(
        `กรุณากรอกเลขบัตรประชาชน ผู้รับผลประโยชน์คนที่ ${i + 1}`
      );

      return;

    }


    const cleanID =
      person.IDCard.replace(/\D/g, "");


    if (cleanID.length !== 13) {

      alert(
        `เลขบัตรประชาชนของผู้รับผลประโยชน์คนที่ ${i + 1} ต้องมี 13 หลัก`
      );

      return;

    }


    person.IDCard =
      cleanID;

  }


  console.log(
    "BENEFICIARIES:",
    applicationData.Beneficiaries
  );

  // ==========================================
  // ไปหน้าตรวจสอบข้อมูล
  // ==========================================

  showReviewForm();
}

function formatAddress(address) {

  if (!address) {

    return "-";

  }


  const parts = [

    address.HouseNo
      ? `บ้านเลขที่ ${address.HouseNo}`
      : "",

    address.Moo
      ? `หมู่ ${address.Moo}`
      : "",

    address.Soi
      ? `ซอย ${address.Soi}`
      : "",

    address.Road
      ? `ถนน ${address.Road}`
      : "",

    address.SubDistrict
      ? `ตำบล/แขวง ${address.SubDistrict}`
      : "",

    address.District
      ? `อำเภอ/เขต ${address.District}`
      : "",

    address.Province
      ? `จังหวัด ${address.Province}`
      : "",

    address.PostalCode
      ? `รหัสไปรษณีย์ ${address.PostalCode}`
      : ""

  ];


  return parts
    .filter(Boolean)
    .join(" ");

}

function setStatus(message) {

  document.getElementById(
    "status"
  ).innerHTML = message;

}

function requiredLabel(text) {

  return `
    <label>
      ${text}
      <span class="required">*</span>
    </label>
  `;

}

function getRequiredValue(id, message) {

  const element =
    document.getElementById(id);

  if (!element) {

    return "";

  }

  const value =
    element.value.trim();

  if (!value) {

    alert(message);

    element.focus();

    return null;

  }

  return value;

}

// ============================================
// SECURITY
// ============================================

function escapeHtml(value) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}
