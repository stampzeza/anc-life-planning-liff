<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ANC Life Planning</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;

      font-family:
        Arial,
        "Noto Sans Thai",
        sans-serif;

      background: #f5f7fa;
      color: #222;
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
    }

    .card {
      background: #fff;

      border-radius: 24px;

      padding: 28px 22px;

      box-shadow:
        0 8px 30px
        rgba(0,0,0,0.08);
    }

    .logo {
      text-align: center;

      font-size: 50px;

      margin-bottom: 8px;
    }

    h1 {
      text-align: center;

      margin: 0;

      font-size: 24px;
    }

    .subtitle {
      text-align: center;

      color: #777;

      margin-top: 8px;

      margin-bottom: 25px;
    }

    .welcome {
      background: #f5f7fa;

      border-radius: 16px;

      padding: 18px;

      margin-bottom: 20px;
    }

    .welcome-title {
      font-size: 14px;

      color: #777;

      margin-bottom: 5px;
    }

    .welcome-name {
      font-size: 20px;

      font-weight: bold;
    }

    .section {
      margin-top: 20px;
    }

    .section-title {
      font-size: 18px;

      font-weight: bold;

      margin-bottom: 12px;
    }

    label {
      display: block;

      margin-top: 14px;

      margin-bottom: 6px;

      font-size: 14px;

      color: #555;
    }

    input,
    textarea {

      width: 100%;

      padding: 13px 14px;

      border: 1px solid #ddd;

      border-radius: 12px;

      font-size: 16px;

      outline: none;

      font-family: inherit;

      background: #fff;

    }

    input:focus,
    textarea:focus {

      border-color: #999;

    }

    textarea {

      min-height: 90px;

      resize: vertical;

    }

    .user-id {

      margin-top: 20px;

      padding: 12px;

      background: #f8f8f8;

      border-radius: 10px;

      font-size: 11px;

      color: #777;

      word-break: break-all;

    }

    .button {

      width: 100%;

      border: none;

      border-radius: 14px;

      padding: 15px;

      margin-top: 25px;

      font-size: 17px;

      font-weight: bold;

      cursor: pointer;

      background: #111;

      color: white;

    }

    .button:active {

      transform: scale(0.98);

    }

    .status {

      text-align: center;

      color: #777;

      margin-bottom: 20px;

    }

    .error {

      padding: 15px;

      background: #fef2f2;

      color: #991b1b;

      border-radius: 12px;

      margin-top: 15px;

    }

    .payment-option {

    display: flex;
  
    align-items: center;
  
    gap: 15px;
  
    padding: 16px;
  
    margin-bottom: 12px;
  
    border: 2px solid #eee;
  
    border-radius: 16px;
  
    cursor: pointer;
  
    transition: 0.2s;
  
  }
  
  .payment-option.selected {
  
    border-color: #111;
  
    background: #f5f5f5;
  
  }
  
  
  .frequency-grid {
  
    display: grid;
  
    grid-template-columns: 1fr;
  
    gap: 10px;
  
  }
  
  
  .frequency-button {
  
    padding: 14px;
  
    border: 2px solid #eee;
  
    border-radius: 14px;
  
    background: white;
  
    font-size: 16px;
  
    cursor: pointer;
  
  }
  
  
  .frequency-button.selected {
  
    border-color: #111;
  
    background: #f5f5f5;
  
  }
  </style>

</head>


<body>

<div class="container">

  <div class="card">

    <div class="logo">
      🎉
    </div>

    <h1>
      ANC Life Planning
    </h1>

    <div class="subtitle">
      ระบบสมัครประกันออนไลน์
    </div>


    <div
      id="status"
      class="status"
    >
      🔄 กำลังเชื่อมต่อ LINE...
    </div>


    <div id="app"></div>

  </div>

</div>


<script>


// ============================================
// LIFF CONFIG
// ============================================

const LIFF_ID =
  "2011077014-4bdad1VJ";


// ============================================
// GLOBAL USER
// ============================================

let lineUser = null;

let applicationData = {};


// ============================================
// START LIFF
// ============================================

async function main() {

  try {

    setStatus(
      "🔄 กำลังเริ่มต้น LIFF..."
    );


    // ------------------------------------------
    // Initialize
    // ------------------------------------------

    await liff.init({

      liffId: LIFF_ID

    });


    // ------------------------------------------
    // Login
    // ------------------------------------------

    if (!liff.isLoggedIn()) {

      setStatus(
        "🔐 กำลังเข้าสู่ระบบ LINE..."
      );

      liff.login();

      return;

    }


    // ------------------------------------------
    // Get Profile
    // ------------------------------------------

    setStatus(
      "🔄 กำลังอ่านข้อมูล LINE..."
    );


    const profile =
      await liff.getProfile();


    lineUser = {

      userId:
        profile.userId,

      displayName:
        profile.displayName,

      pictureUrl:
        profile.pictureUrl || ""

    };


    console.log(
      "LINE USER:",
      lineUser
    );


    // ------------------------------------------
    // Show Application Form
    // ------------------------------------------

    setStatus(
      "✅ เชื่อมต่อ LINE สำเร็จ"
    );


    showApplicationForm();


  } catch (error) {

    console.error(error);


    setStatus(
      "❌ เกิดข้อผิดพลาด"
    );


    document.getElementById(
      "app"
    ).innerHTML = `

      <div class="error">

        ไม่สามารถเชื่อมต่อ LINE ได้

        <br><br>

        ${escapeHtml(
          error.message ||
          error.toString()
        )}

      </div>

    `;

  }

}


// ============================================
// APPLICATION FORM
// ============================================

function showApplicationForm() {

  const app =
    document.getElementById("app");


  app.innerHTML = `

    <div class="welcome">

      <div class="welcome-title">
        ยินดีต้อนรับครับ
      </div>

      <div class="welcome-name">
        ${escapeHtml(
          lineUser.displayName
        )}
      </div>

    </div>


    <div class="section">

      <div class="section-title">
        📝 ข้อมูลผู้สมัคร
      </div>


      <label>
        ชื่อ - นามสกุล
      </label>

      <input
        id="fullName"
        type="text"
        placeholder="กรุณากรอกชื่อ - นามสกุล"
      >


      <label>
        เบอร์โทรศัพท์
      </label>

      <input
        id="phone"
        type="tel"
        placeholder="08xxxxxxxx"
      >


      <label>
        อีเมล
      </label>

      <input
        id="email"
        type="email"
        placeholder="example@email.com"
      >


      <label>
        น้ำหนัก (กก.)
      </label>

      <input
        id="weight"
        type="number"
        placeholder="เช่น 70"
      >


      <label>
        ส่วนสูง (ซม.)
      </label>

      <input
        id="height"
        type="number"
        placeholder="เช่น 170"
      >


      <label>
        โรคประจำตัว
      </label>

      <textarea
        id="disease"
        placeholder="หากไม่มี กรุณาพิมพ์ว่า ไม่มี"
      ></textarea>


      <label>
        ประวัติการรักษาในโรงพยาบาล
      </label>

      <textarea
        id="hospitalHistory"
        placeholder="หากไม่มี กรุณาพิมพ์ว่า ไม่มี"
      ></textarea>


    </div>


    <div class="user-id">

      LINE USER ID

      <br>

      ${escapeHtml(
        lineUser.userId
      )}

    </div>


    <button
      class="button"
      onclick="nextStep()"
    >

      ดำเนินการต่อ →

    </button>

  `;

}


// ============================================
// NEXT STEP
// ============================================

function nextStep() {
alert("กด Next แล้วครับ");
  const fullName =
    document.getElementById(
      "fullName"
    ).value.trim();

  const phone =
    document.getElementById(
      "phone"
    ).value.trim();

  const email =
    document.getElementById(
      "email"
    ).value.trim();

  const weight =
    document.getElementById(
      "weight"
    ).value.trim();

  const height =
    document.getElementById(
      "height"
    ).value.trim();

  const disease =
    document.getElementById(
      "disease"
    ).value.trim();

  const hospitalHistory =
    document.getElementById(
      "hospitalHistory"
    ).value.trim();


  // ============================================
  // ตรวจข้อมูลจำเป็น
  // ============================================

  if (!fullName) {

    alert(
      "กรุณากรอกชื่อ - นามสกุล"
    );

    return;

  }


  if (!phone) {

    alert(
      "กรุณากรอกเบอร์โทรศัพท์"
    );

    return;

  }


  // ============================================
  // เก็บข้อมูลไว้ในตัวแปร
  // ============================================

  applicationData = {

    USER_ID:
      lineUser.userId,

    DisplayName:
      lineUser.displayName,

    FullName:
      fullName,

    Phone:
      phone,

    Email:
      email,

    Weight:
      weight,

    Height:
      height,

    Disease:
      disease,

    HospitalHistory:
      hospitalHistory

  };


  console.log(
    "APPLICATION DATA:",
    applicationData
  );


  // ============================================
  // ไปหน้าชำระเงิน
  // ============================================

  showPaymentForm();

}

function showPaymentForm() {

  const app =
    document.getElementById("app");


  app.innerHTML = `

    <div class="section">

      <div class="section-title">
        💳 วิธีการชำระเบี้ย
      </div>

      <div style="
        color:#777;
        margin-bottom:18px;
      ">
        เลือกช่องทางการชำระเงินที่สะดวก
      </div>


      <!-- QR CODE -->

      <div
        class="payment-option"
        onclick="selectPayment('QR Code ออนไลน์')"
        id="payment-qr"
      >

        <div style="
          font-size:28px;
        ">
          📱
        </div>

        <div>

          <div style="
            font-weight:bold;
            font-size:16px;
          ">
            QR Code ออนไลน์
          </div>

          <div style="
            color:#777;
            font-size:13px;
            margin-top:4px;
          ">
            ชำระผ่าน QR Code
          </div>

        </div>

      </div>


      <!-- CREDIT CARD -->

      <div
        class="payment-option"
        onclick="selectPayment('บัตรเครดิต')"
        id="payment-card"
      >

        <div style="
          font-size:28px;
        ">
          💳
        </div>

        <div>

          <div style="
            font-weight:bold;
            font-size:16px;
          ">
            บัตรเครดิต
          </div>

          <div style="
            color:#777;
            font-size:13px;
            margin-top:4px;
          ">
            ชำระผ่านบัตรเครดิต
          </div>

        </div>

      </div>


      <div class="section">

        <div class="section-title">
          📅 ความถี่การชำระ
        </div>


        <div class="frequency-grid">


          <button
            class="frequency-button"
            onclick="selectFrequency('รายปี')"
            id="freq-year"
          >
            📅 รายปี
          </button>


          <button
            class="frequency-button"
            onclick="selectFrequency('ราย 6 เดือน')"
            id="freq-6m"
          >
            📆 ราย 6 เดือน
          </button>


          <button
            class="frequency-button"
            onclick="selectFrequency('ราย 3 เดือน')"
            id="freq-3m"
          >
            🗓️ ราย 3 เดือน
          </button>


        </div>

      </div>


      <button
        class="button"
        onclick="confirmPayment()"
      >

        ดำเนินการต่อ →

      </button>


      <button
        onclick="showApplicationForm()"
        style="
          width:100%;
          margin-top:12px;
          padding:12px;
          border:none;
          background:none;
          color:#777;
          font-size:15px;
        "
      >

        ← กลับไปแก้ไขข้อมูล

      </button>

    </div>

  `;

}

function selectPayment(method) {

  applicationData.PaymentMethod =
    method;


  document
    .querySelectorAll(
      ".payment-option"
    )
    .forEach(el => {

      el.classList.remove(
        "selected"
      );

    });


  if (
    method ===
    "QR Code ออนไลน์"
  ) {

    document
      .getElementById(
        "payment-qr"
      )
      .classList.add(
        "selected"
      );

  }


  if (
    method ===
    "บัตรเครดิต"
  ) {

    document
      .getElementById(
        "payment-card"
      )
      .classList.add(
        "selected"
      );

  }

}

function selectFrequency(frequency) {

  applicationData.PaymentFrequency =
    frequency;


  document
    .querySelectorAll(
      ".frequency-button"
    )
    .forEach(el => {

      el.classList.remove(
        "selected"
      );

    });


  if (
    frequency === "รายปี"
  ) {

    document
      .getElementById(
        "freq-year"
      )
      .classList.add(
        "selected"
      );

  }


  if (
    frequency === "ราย 6 เดือน"
  ) {

    document
      .getElementById(
        "freq-6m"
      )
      .classList.add(
        "selected"
      );

  }


  if (
    frequency === "ราย 3 เดือน"
  ) {

    document
      .getElementById(
        "freq-3m"
      )
      .classList.add(
        "selected"
      );

  }

}

function confirmPayment() {

  if (
    !applicationData.PaymentMethod
  ) {

    alert(
      "กรุณาเลือกช่องทางการชำระเงิน"
    );

    return;

  }


  if (
    !applicationData.PaymentFrequency
  ) {

    alert(
      "กรุณาเลือกความถี่การชำระเบี้ย"
    );

    return;

  }


  console.log(
    "ข้อมูลทั้งหมด:",
    applicationData
  );


  alert(
    "เลือกวิธีชำระเงินเรียบร้อยแล้วครับ"
  );

}

// ============================================
// STATUS
// ============================================

function setStatus(message) {

  document.getElementById(
    "status"
  ).innerHTML = message;

}


// ============================================
// SECURITY
// ============================================

function escapeHtml(value) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


// ============================================
// START
// ============================================

main();

</script>

</body>

</html>
