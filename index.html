<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ANC Life Planning</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family:
        Arial,
        "Noto Sans Thai",
        sans-serif;

      background: #f5f7fa;
      color: #222;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
    }

    .card {
      background: white;
      border-radius: 24px;
      padding: 30px 22px;

      box-shadow:
        0 8px 30px rgba(0,0,0,0.08);
    }

    .icon {
      text-align: center;
      font-size: 52px;
      margin-bottom: 10px;
    }

    h1 {
      text-align: center;
      font-size: 24px;
      margin: 0 0 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    .status {
      padding: 15px;
      border-radius: 14px;
      background: #f5f7fa;
      text-align: center;
      color: #555;
    }

    .info {
      margin-top: 15px;
      padding: 16px;
      background: #f5f7fa;
      border-radius: 14px;
    }

    .label {
      font-size: 13px;
      color: #777;
      margin-bottom: 6px;
    }

    .value {
      font-size: 15px;
      word-break: break-all;
    }

    .success {
      margin-top: 20px;
      padding: 16px;
      background: #ecfdf5;
      border-radius: 14px;
      color: #166534;
      text-align: center;
      font-weight: bold;
    }

    .error {
      margin-top: 20px;
      padding: 16px;
      background: #fef2f2;
      border-radius: 14px;
      color: #991b1b;
    }

  </style>

</head>


<body>

  <div class="container">

    <div class="card">

      <div class="icon">
        🎉
      </div>

      <h1>
        ANC Life Planning
      </h1>

      <div class="subtitle">
        ระบบสมัครประกันออนไลน์
      </div>

      <div
        id="status"
        class="status"
      >
        🔄 กำลังเริ่มต้น LIFF...
      </div>

      <div id="profile"></div>

    </div>

  </div>


<script>


// =================================================
// CONFIG
// =================================================

const LIFF_ID =
  "2011077014-4bdad1VJ";


const API_URL =
  "https://script.google.com/macros/s/AKfycbx2D04TYozU4CPQrQ1qAFWnWj5c4y9h9M9T6pgYzHleQfd2XisYmJRqvJAFHoJu9sNM/exec";


// =================================================
// MAIN
// =================================================

async function main() {

  try {

    setStatus(
      "🔄 กำลังเริ่มต้น LIFF..."
    );


    // =============================================
    // 1. Initialize LIFF
    // =============================================

    await liff.init({

      liffId: LIFF_ID

    });


    setStatus(
      "✅ LIFF เริ่มต้นสำเร็จ"
    );


    // =============================================
    // 2. ตรวจ Login
    // =============================================

    if (!liff.isLoggedIn()) {

      setStatus(
        "🔐 กำลังเข้าสู่ระบบ LINE..."
      );

      liff.login();

      return;

    }


    // =============================================
    // 3. ขอ ID Token
    // =============================================

    setStatus(
      "🔐 กำลังยืนยันตัวตน..."
    );


    const idToken =
      liff.getIDToken();


    if (!idToken) {

      throw new Error(
        "ไม่พบ ID Token"
      );

    }


    // =============================================
    // 4. ส่ง ID Token ไป Apps Script
    // =============================================

    setStatus(
      "🔄 กำลังตรวจสอบข้อมูล..."
    );


    const response =
      await fetch(
        API_URL,
        {

          method: "POST",

          headers: {

            "Content-Type":
              "application/json"

          },

          body: JSON.stringify({

            idToken: idToken

          })

        }
      );


    // =============================================
    // 5. อ่าน Response
    // =============================================

    const result =
      await response.json();


    if (!result.success) {

      throw new Error(
        result.error ||
        "ไม่สามารถยืนยันตัวตนได้"
      );

    }


    // =============================================
    // 6. แสดงข้อมูลที่ Server ยืนยันแล้ว
    // =============================================

    setStatus(
      "✅ ยืนยันตัวตนสำเร็จ"
    );


    document.getElementById(
      "profile"
    ).innerHTML = `

      <div class="info">

        <div class="label">
          ชื่อผู้ใช้งาน
        </div>

        <div class="value">
          ${escapeHtml(
            result.displayName
          )}
        </div>

      </div>


      <div class="info">

        <div class="label">
          USER ID
        </div>

        <div class="value">
          ${escapeHtml(
            result.USER_ID
          )}
        </div>

      </div>


      <div class="success">

        ✅ LINE ID ได้รับการยืนยันแล้ว

      </div>

    `;


  } catch (error) {

    console.error(error);


    document.getElementById(
      "profile"
    ).innerHTML = `

      <div class="error">

        ❌ ไม่สามารถยืนยันตัวตนได้

        <br><br>

        ${escapeHtml(
          error.message ||
          error.toString()
        )}

      </div>

    `;


    setStatus(
      "เกิดข้อผิดพลาด"
    );

  }

}


// =================================================
// STATUS
// =================================================

function setStatus(message) {

  document.getElementById(
    "status"
  ).innerHTML = message;

}


// =================================================
// SECURITY
// =================================================

function escapeHtml(value) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


// =================================================
// START
// =================================================

main();

</script>

</body>

</html>
